<!DOCTYPE html>
<html lang="de">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spielanleitung Mobile/Touch</title>

    <style>
        :root {
            --bg: #121212;
            --card: #1e1e1e;
            --accent: #00bfff;
            --text: #ffffff;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 20px;
        }

        .container {
            background-color: var(--card);
            border-radius: 18px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
            margin: auto;
        }

        h1 {
            font-size: clamp(22px, 5vw, 32px);
            margin: 0;
        }

        button {
            background-color: var(--accent);
            color: white;
            border: none;
            padding: 10px 18px;
            border-radius: 10px;
            cursor: pointer;
            font-size: 16px;
            min-height: 44px;
            /* Touch-friendly */
        }

        button:active {
            transform: scale(0.97);
        }

        .header {
            display: grid;
            grid-template-columns: 1fr auto 1fr;
            align-items: center;
            padding: 20px 20px 10px 20px;
        }

        .header h1 {
            grid-column: 2;
            text-align: center;
        }

        .header .btn {
            grid-column: 3;
            justify-self: end;
        }

        .anleitung {
            margin-top: 5px;
            padding-top: 5px;
            max-width: 60%;
            height: auto;
            display: block;
            margin-left: auto;
            margin-right: auto;
        }

        #duration,
        #pause {
            text-align: center;
            margin-top: 15px;
            font-size: 18px;
        }

        .container {
            padding-bottom: 30px;
        }

        @media (max-width: 560px) {
            .container {
                padding: 0;
            }
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="header">
            <h1 id="title">Spielanleitung Touch</h1>
            <button class="btn" onclick="toggleLanguage()" id="langButton"><img src="img/united-kingdom-flag.png"
                    alt="English"></button>
        </div>
        <img class="anleitung" src="img/mobil-anleitung_de.jpg" alt="Instructions">
        <div id="duration"></div>
        <div id="pause"></div>
    </div>

    <script>
        let currentLang = "de";

        function setLanguage(lang) {
            currentLang = lang;
            document.documentElement.lang = lang;

            if (lang === "en") {
                document.getElementById("title").innerText = "Game Instructions Touch";
                langButton.innerHTML = '<img src="img/germany-flag.png" alt="Deutsch">';

                document.querySelector(".anleitung").src = "img/mobil-anleitung.jpg";

                document.getElementById("duration").innerText =
                    "The game lasts 5 minutes.";

                document.getElementById("pause").innerHTML =
                    "Double tap for pause";
            } else {
                document.getElementById("title").innerText = "Spielanleitung Touch";
                langButton.innerHTML = '<img src="img/united-kingdom-flag.png" alt="English">';

                document.querySelector(".anleitung").src = "img/mobil-anleitung_de.jpg";

                document.getElementById("duration").innerText =
                    "Das Spiel geht 5 Minuten.";

                document.getElementById("pause").innerHTML =
                    "Doppelt tippen für Pause";
            }
        }

        function toggleLanguage() {
            setLanguage(currentLang === "de" ? "en" : "de");
        }

        // 🔎 Automatische Spracherkennung
        document.addEventListener("DOMContentLoaded", function () {
            const browserLang = navigator.language || navigator.userLanguage;

            if (browserLang && browserLang.toLowerCase().startsWith("de")) {
                setLanguage("de");
            } else {
                setLanguage("en");
            }
        });
    </script>

</body>

</html>
